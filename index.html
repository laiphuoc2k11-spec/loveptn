<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi người thương 1/6</title>
    <style>
        :root {
            --primary-pink: #ff85a2;
            --dark-pink: #ff4d6d;
            --soft-white: #fff5f7;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--soft-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        /* Hiệu ứng cánh hoa rơi */
        .petal {
            position: absolute;
            background-color: var(--primary-pink);
            border-radius: 150% 0 150% 0;
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        /* CSS Bông hoa */
        .flower {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .flower:active {
            transform: scale(0.9);
        }

        .petal-main {
            position: absolute;
            width: 50px;
            height: 50px;
            background: var(--dark-pink);
            border-radius: 50% 50% 0 50%;
            left: 35px;
            top: 0;
            transform-origin: bottom right;
        }

        .center {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ffcc00;
            border-radius: 50%;
            top: 35px;
            left: 60px;
            z-index: 2;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .hint {
            color: var(--dark-pink);
            font-size: 1.1rem;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        #wish-box {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            max-width: 80%;
            margin: 0 auto;
        }

        #wish-box.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        h1 { color: var(--dark-pink); font-size: 1.5rem; margin-bottom: 15px; }
        p { color: #555; line-height: 1.6; font-size: 1.05rem; }

    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="./music.mp3" type="audio/mpeg">
    </audio>

    <div id="leaf-container"></div>

    <div class="container">
        <div id="intro">
            <div class="flower" onclick="showWish()">
                <div class="petal-main" style="transform: rotate(0deg)"></div>
                <div class="petal-main" style="transform: rotate(72deg)"></div>
                <div class="petal-main" style="transform: rotate(144deg)"></div>
                <div class="petal-main" style="transform: rotate(216deg)"></div>
                <div class="petal-main" style="transform: rotate(288deg)"></div>
                <div class="center"></div>
            </div>
            <p class="hint">Chạm vào bông hoa nhé!</p>
        </div>

        <div id="wish-box">
            <h1>Gửi em! 🌸</h1>
            <p>             
                Gửi bây bi,<br><br>
                Chúc em một ngày 1/6 thật ngọt ngào và tràn đầy hạnh phúc.
                Cảm ơn em đã luôn ở bên cạnh và là niềm động lực của anh. <br>
                Mong rằng nụ cười của em sẽ luôn rạng rỡ như những bông hoa này!<br><br>
                <b>Yêu em rất nhiều ❤️</b>
                <br><br>
                <i style="font-size: 0.8rem; color: #888;">đọc cái zèe, toi iu emm😉</i>
            </p>
        </div>
    </div>

    <script>
        function createPetals() {
            const container = document.getElementById('leaf-container');
            for (let i = 0; i < 25; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = Math.random() * 15 + 10 + 'px';
                petal.style.height = petal.style.width;
                petal.style.animationDuration = Math.random() * 3 + 2 + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(petal);
            }
        }

        function showWish() {
            // Phát nhạc ngay khi chạm
            const music = document.getElementById('bgMusic');
            music.play().catch(error => console.log("Trình duyệt chặn phát nhạc tự động:", error));

            document.getElementById('intro').style.display = 'none';
            const wishBox = document.getElementById('wish-box');
            wishBox.classList.add('show');
            
            for(let i=0; i<30; i++) {
                setTimeout(createSinglePetal, i * 50);
            }
        }

        function createSinglePetal() {
            const p = document.createElement('div');
            p.className = 'petal';
            p.style.left = '50vw';
            p.style.top = '50vh';
            p.style.width = '10px';
            p.style.height = '10px';
            p.style.animation = 'none';
            p.style.transition = 'all 1s ease-out';
            document.body.appendChild(p);
            
            setTimeout(() => {
                p.style.transform = `translate(${(Math.random()-0.5)*300}px, ${(Math.random()-0.5)*300}px) rotate(${Math.random()*360}deg)`;
                p.style.opacity = '0';
            }, 50);
            
            setTimeout(() => p.remove(), 1000);
        }

        window.onload = createPetals;
    </script>
</body>
</html>
